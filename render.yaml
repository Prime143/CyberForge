services:
  - type: web
    name: cyberforge
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEAD_PORTAL_ROUTE
        value: /lead-hub
      - key: ADMIN_API_KEY
        generateValue: true

